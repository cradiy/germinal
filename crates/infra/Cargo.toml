[package]
name = "germinal-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
germinal-ports.workspace = true
germinal-domain.workspace = true

alacritty_terminal = "0.26"
wgpu = "29.0"
crossfont = "0.9"
unicode-width = "0.2"
winit = "0.30"
pollster = "0.4"
portable-pty = "0.9"


[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "process", "fs"] }
libc = "0.2"
compio = { version = "0.19", features = ["runtime", "io", "fs"] }
