[package]
name = "germinal-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
media-gstreamer = [
  "dep:gstreamer",
  "dep:gstreamer-allocators",
  "dep:gstreamer-app",
  "dep:gstreamer-video",
]

[dependencies]
germinal-ports.workspace = true
germinal-domain.workspace = true
germinal-gnative-protocol.workspace = true

alacritty_terminal.workspace = true
wgpu.workspace = true
crossfont.workspace = true
unicode-width.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
cosmic-text.workspace = true
winit.workspace = true
pollster.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
rayon.workspace = true
ash.workspace = true
compio = { workspace = true, features = ["runtime", "time", "io", "fs", "net"] }
flume = "0.11"
base64.workspace = true
flate2.workspace = true
png.workspace = true
notify-rust.workspace = true


[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "process", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
compio = { workspace = true, features = ["io-uring"] }
gstreamer = { workspace = true, optional = true }
gstreamer-allocators = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
compio = { workspace = true, features = ["polling"] }
