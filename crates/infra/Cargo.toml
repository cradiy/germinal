[package]
name = "germinal-infra"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dirs.workspace = true
germinal-ports.workspace = true
germinal-domain.workspace = true
germinal-gnative-protocol.workspace = true

alacritty_terminal.workspace = true
wgpu.workspace = true
crossfont.workspace = true
unicode-width.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
cosmic-text.workspace = true
winit.workspace = true
pollster.workspace = true
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
tracing.workspace = true
thiserror.workspace = true
rayon.workspace = true
compio = { workspace = true, features = ["runtime", "time", "io", "fs", "net"] }
flume.workspace = true
base64.workspace = true
flate2.workspace = true
png.workspace = true
resvg.workspace = true
notify-rust.workspace = true
memmap2.workspace = true


[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["term", "process", "fs", "mman"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs.workspace = true
compio = { workspace = true, features = ["io-uring"] }
[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
compio = { workspace = true, features = ["polling"] }
